<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Full-Stack-Skills social preview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1e3a5f"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Stack layers (right) -->
  <g transform="translate(900, 180)" opacity="0.30">
    <rect x="0" y="0" width="280" height="40" rx="6" fill="#06b6d4"/>
    <text x="20" y="27" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Frontend · Vue / React / Angular</text>
    <rect x="0" y="50" width="280" height="40" rx="6" fill="#3b82f6"/>
    <text x="20" y="77" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Backend · Spring / Go / Rust</text>
    <rect x="0" y="100" width="280" height="40" rx="6" fill="#8b5cf6"/>
    <text x="20" y="127" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Mobile · iOS / Android / uniapp</text>
    <rect x="0" y="150" width="280" height="40" rx="6" fill="#ec4899"/>
    <text x="20" y="177" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">DevOps · K8s / Docker / CI</text>
  </g>

  <!-- Title -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="100" font-weight="800" fill="url(#title)" letter-spacing="-3">Full-Stack-Skills</text>

  <!-- Subtitle -->
  <text x="104" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="30" font-weight="400" fill="#dbeafe" letter-spacing="0.5">
    Full-stack Agent Skills marketplace
  </text>

  <!-- Tagline -->
  <text x="104" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="300" fill="#93c5fd" letter-spacing="2">
    46 repos · 460+ SKILL.md · 43+ platforms
  </text>

  <!-- Partme-AI badge -->
  <g transform="translate(104, 460)">
    <rect x="0" y="0" width="320" height="50" rx="25" fill="#6366f1"/>
    <text x="160" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">
      Part of partme-ai ecosystem
    </text>
  </g>

  <rect x="0" y="628" width="1280" height="12" fill="url(#title)"/>
</svg>